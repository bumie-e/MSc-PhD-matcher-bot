[project]
name = "msc-phd-matcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.23",
    "supabase>=2.0",
    "httpx>=0.25",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "tavily-python>=0.5",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "config"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
