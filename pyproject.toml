[project]
name = "msc-phd-matcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.51.0",
    "beautifulsoup4>=4.15.0",
    "pymupdf>=2.1",
    "supabase>=2.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.0",
    "tavily-python>=0.5",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "config"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
