name: Daily Opportunity Search

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run search agent
        id: search
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
        run: |
          uv run python -m agents.search.agent 2> >(tee search_stderr.log >&2)
          grep NEW_OPPORTUNITY_IDS search_stderr.log >> "$GITHUB_OUTPUT" || echo "NEW_OPPORTUNITY_IDS=" >> "$GITHUB_OUTPUT"

      - name: Dispatch match.yml for new opportunities
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m agents.orchestrator --opp-ids "${{ steps.search.outputs.NEW_OPPORTUNITY_IDS }}"
