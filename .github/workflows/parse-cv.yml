name: Parse Uploaded CV

on:
  workflow_dispatch:
    inputs:
      user_id:
        required: true
      storage_path:
        required: true

permissions:
  contents: read
  actions: write

jobs:
  parse-cv:
    runs-on: ubuntu-latest
    steps:
      # The repo is public: hide the user id and CV path from this run's logs.
      - name: Mask identifiers
        env:
          USER_ID: ${{ inputs.user_id }}
          STORAGE_PATH: ${{ inputs.storage_path }}
        run: |
          echo "::add-mask::$USER_ID"
          echo "::add-mask::$STORAGE_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: uv sync

      - name: Parse CV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Decrypts the user's own AI key, which reads their CV.
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
          USER_ID: ${{ inputs.user_id }}
          STORAGE_PATH: ${{ inputs.storage_path }}
        run: |
          uv run python -m agents.cv.parser --user-id "$USER_ID" --storage-path "$STORAGE_PATH"

      - name: Dispatch match.yml for this user
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_ID: ${{ inputs.user_id }}
          REPO: ${{ github.repository }}
        run: |
          body=$(jq -n --arg uid "$USER_ID" \
            '{ref:"main",inputs:{opp_ids:"all",user_id:$uid,rescore:"true"}}')
          http_status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/match.yml/dispatches" \
            -d "$body")
          echo "HTTP status: $http_status"
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "Dispatch failed"
            exit 1
          fi
          exit 0
