name: Match Opportunities to Users

on:
  workflow_dispatch:
    inputs:
      opp_ids:
        description: 'Comma-separated opportunity ids, or "all"'
        required: true
        default: "all"
      user_id:
        description: "Restrict to one user id (omit to run for all eligible users)"
        required: false
        default: ""
      rescore:
        description: "Re-score openings that already have a match (after a CV change)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - name: Mask identifiers
        env:
          USER_ID: ${{ inputs.user_id }}
        run: |
          if [ -n "$USER_ID" ]; then echo "::add-mask::$USER_ID"; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Install dependencies
        run: uv sync

      - name: Run match agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Decrypts each user's own AI key. No shared LLM key is used here.
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
          OPP_IDS: ${{ inputs.opp_ids }}
          USER_ID: ${{ inputs.user_id }}
          RESCORE: ${{ inputs.rescore }}
        run: |
          args=(--opp-ids "$OPP_IDS" --user-id "$USER_ID")
          if [ "$RESCORE" = "true" ]; then args+=(--rescore); fi
          uv run python -m agents.matching.agent "${args[@]}"
