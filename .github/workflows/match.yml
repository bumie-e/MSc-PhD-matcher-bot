name: Match Opportunities to Users

on:
  workflow_dispatch:
    inputs:
      opp_ids:
        description: 'Comma-separated opportunity ids, or "all"'
        required: true
        default: "all"
      user_id:
        description: "Restrict to one user id (omit to run for all eligible users)"
        required: false
        default: ""
      rescore:
        description: "Re-score openings that already have a match (after a CV change)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run match agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Decrypts each user's own AI key. No shared LLM key is used here.
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
        run: |
          uv run python -m agents.matching.agent \
            --opp-ids "${{ inputs.opp_ids }}" \
            --user-id "${{ inputs.user_id }}" \
            ${{ inputs.rescore == 'true' && '--rescore' || '' }}
